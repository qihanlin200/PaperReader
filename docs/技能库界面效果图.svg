    <path d="M14 103Q24 98 24 103Q34 98 34 103V125Q24 120 24 125Q14 120 14 125Z M24 103V125"/>
    <circle cx="24" cy="174" r="10"/><path d="M17 181L13 186 M21 169L24 164L27 169L32 172L27 175L24 180L21 175L16 172Z"/>
