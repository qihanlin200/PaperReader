name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build and smoke test
        shell: cmd
        run: call build-windows.bat
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PaperReader-Windows-x64
          path: dist/PaperReader-Windows-x64.zip
          if-no-files-found: error
      - name: Publish Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" dist/PaperReader-Windows-x64.zip --clobber
